[build-system]
requires = ["setuptools>=64,<85", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mujoco-ros2-manipulation"
version = "0.2.0"
description = "MuJoCo and ROS 2 manipulator simulation workspace tools"
requires-python = ">=3.10"
# Compatibility constraints remain in requirements.txt (Dependabot watches it).
dynamic = ["dependencies"]

[project.optional-dependencies]
reports = ["jsonschema>=4.18,<5"]

[project.scripts]
manipulation-report = "mujoco_ros2_manipulation.reporting.__main__:main"
manipulation-prepare = "mujoco_ros2_manipulation.model_build.prepare:main"
manipulation-verify = "mujoco_ros2_manipulation.verification.ros_checks:main"
manipulation-verify-cancel = "mujoco_ros2_manipulation.verification.verify_robot_cancel:main"
manipulation-images = "mujoco_ros2_manipulation.verification.images:main"
manipulation-build = "mujoco_ros2_manipulation.build:main"

manipulation-prepare-workcell = "mujoco_ros2_manipulation.workcells.prepare:main"
manipulation-demo-contact = "mujoco_ros2_manipulation.workcells.verify_contact_demo:main"
manipulation-verify-timing = "mujoco_ros2_manipulation.workcells.verify_timing:main"
manipulation-compare-interference = "mujoco_ros2_manipulation.workcells.verify_interference_comparison:main"
manipulation-verify-interference = "mujoco_ros2_manipulation.workcells.verify_interference:main"
manipulation-verify-clock-stop = "mujoco_ros2_manipulation.workcells.verify_clock_stop:main"
manipulation-verify-process-crash = "mujoco_ros2_manipulation.workcells.verify_process_crash:main"
manipulation-verify-contact-stop = "mujoco_ros2_manipulation.workcells.verify_contact_stop:main"
manipulation-verify-workcell = "mujoco_ros2_manipulation.workcells.verify:main"
manipulation-motion-server = "mujoco_ros2_manipulation.workcells.motion_server:main"
manipulation-command = "mujoco_ros2_manipulation.workcells.motion_client:main"
manipulation-verify-replanning = "mujoco_ros2_manipulation.workcells.verify_motion_replanning:main"
manipulation-reproduce-motion = "mujoco_ros2_manipulation.workcells.reproduce_motion:main"
manipulation-benchmark-fixed = "mujoco_ros2_manipulation.workcells.benchmark_fixed_motion:main"
manipulation-export-fixed-motion = "mujoco_ros2_manipulation.workcells.export_fixed_motion:main"
manipulation-import-fixed-report = "mujoco_ros2_manipulation.reporting.fixed_motion:main"
manipulation-benchmark-motion = "mujoco_ros2_manipulation.workcells.benchmark_motion:main"
manipulation-benchmark-planner-cache = "mujoco_ros2_manipulation.workcells.benchmark_planner_cache:main"
manipulation-operator = "mujoco_ros2_manipulation.operator_console.__main__:main"
manipulation-verify-operator = "mujoco_ros2_manipulation.operator_console.verify:main"
manipulation-verify-views = "mujoco_ros2_manipulation.operator_console.verify_views:main"
manipulation-verify-demos = "mujoco_ros2_manipulation.operator_console.verify_demos:main"
manipulation-import-step = "mujoco_ros2_manipulation.workcells.import_step:main"
manipulation-prepare-environment = "mujoco_ros2_manipulation.workcells.environment_cli:main"
manipulation-verify-environment = "mujoco_ros2_manipulation.workcells.verify_environment_overlay:main"
manipulation-verify-environment-views = "mujoco_ros2_manipulation.operator_console.verify_environment_views:main"
manipulation-grasp-demo = "mujoco_ros2_manipulation.grasping.demo_server:main"
manipulation-grasp-export = "mujoco_ros2_manipulation.grasping.display_export:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mujoco_ros2_manipulation.reporting" = ["report.schema.json", "operator-demos.schema.json", "templates/*.html", "templates/*.css"]

"mujoco_ros2_manipulation.operator_console" = ["static/*.html", "static/*.css", "static/*.js", "static/*.mjs", "static/vendor/*.js", "static/vendor/*.json", "static/vendor/LICENSE"]
"mujoco_ros2_manipulation.grasping" = ["static/*.html", "static/*.css", "static/*.js"]
