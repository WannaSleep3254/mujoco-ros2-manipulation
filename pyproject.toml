[build-system]
requires = ["setuptools>=64,<80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mujoco-ros2-manipulation"
version = "0.2.0"
description = "MuJoCo and ROS 2 manipulator simulation workspace tools"
requires-python = ">=3.10"
# Compatibility constraints remain in requirements.txt (Dependabot watches it).
dynamic = ["dependencies"]

[project.optional-dependencies]
reports = ["jsonschema>=4.18,<5"]

[project.scripts]
manipulation-report = "mujoco_ros2_manipulation.reporting.__main__:main"
manipulation-prepare = "mujoco_ros2_manipulation.model_build.prepare:main"
manipulation-verify = "mujoco_ros2_manipulation.verification.ros_checks:main"
manipulation-images = "mujoco_ros2_manipulation.verification.images:main"
manipulation-build = "mujoco_ros2_manipulation.build:main"

manipulation-prepare-workcell = "mujoco_ros2_manipulation.workcells.prepare:main"
manipulation-demo-contact = "mujoco_ros2_manipulation.workcells.verify_contact_demo:main"
manipulation-verify-timing = "mujoco_ros2_manipulation.workcells.verify_timing:main"
manipulation-compare-interference = "mujoco_ros2_manipulation.workcells.verify_interference_comparison:main"
manipulation-verify-interference = "mujoco_ros2_manipulation.workcells.verify_interference:main"
manipulation-verify-clock-stop = "mujoco_ros2_manipulation.workcells.verify_clock_stop:main"
manipulation-verify-process-crash = "mujoco_ros2_manipulation.workcells.verify_process_crash:main"
manipulation-verify-contact-stop = "mujoco_ros2_manipulation.workcells.verify_contact_stop:main"
manipulation-verify-workcell = "mujoco_ros2_manipulation.workcells.verify:main"
manipulation-motion-server = "mujoco_ros2_manipulation.workcells.motion_server:main"
manipulation-command = "mujoco_ros2_manipulation.workcells.motion_client:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mujoco_ros2_manipulation.reporting" = ["report.schema.json", "templates/*.html", "templates/*.css"]
