# 일반 버전 업데이트만 제한하며 보안 설정과 자동 병합 설정은 변경하지 않습니다.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    versioning-strategy: "increase-if-necessary"
    groups:
      python-helpers:
        applies-to: "version-updates"
        patterns:
          - "pycollada"
          - "pillow"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # major 변경은 Python 3.10 / ROS Humble 호환성을 별도 검증합니다.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # 현재 버전이 없는 범위형 요구사항에도 적용되도록 이름으로 제외합니다.
      # versions 범위는 지정하지 않아 보안 전용 실행의 수정 경로는 유지합니다.
      - dependency-name: "mujoco"
      - dependency-name: "numpy"
      # ROS 시스템 PyYAML 5.4.1을 허용하는 하한을 유지합니다.
      - dependency-name: "pyyaml"
