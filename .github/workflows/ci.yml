name: Verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, devel, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Python package and unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -r requirements.txt build '.[reports]'
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: python scripts/check_repository.py
      - run: python -m unittest discover -s tests/unit -t . -v
      - name: Publication report schema, evidence and generated files
        run: |
          python scripts/import_phase1_report.py --check
          python scripts/import_motion_request_report.py --check docs/reports/2026-10-21-request-timing
          python scripts/import_random_motion_report.py --check docs/reports/2026-10-21-random-motion
          python scripts/import_search_optimization_report.py --check docs/reports/2026-10-21-search-optimization
          manipulation-report validate
          manipulation-report build --check
          manipulation-report --reports-dir docs/reporting validate
          manipulation-report site --output runtime/report-site
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: report-site-preview
          path: runtime/report-site/
          retention-days: 14
      - name: Installed package works outside checkout
        run: |
          cd /tmp
          manipulation-report --reports-dir "$GITHUB_WORKSPACE/docs/reports" build --check
          MUJOCO_ROS2_WORKSPACE="$GITHUB_WORKSPACE" manipulation-prepare --list
          MUJOCO_ROS2_WORKSPACE="$GITHUB_WORKSPACE" manipulation-build --dry-run --robots fr5
          MUJOCO_ROS2_WORKSPACE="$GITHUB_WORKSPACE" manipulation-build --dry-run --workcell fr5_ur5e
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-distributions
          path: dist/
  ros:
    name: ROS Humble (${{ matrix.robot }}, ${{ matrix.scene }})
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {robot: fr5, scene: default}
          - {robot: fr10, scene: default}
          - {robot: ur5e, scene: default}
          - {robot: fr5, scene: pedestal}
          - {robot: workcell, scene: fr5_ur5e}
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Trust the checked-out workspace in the ROS container
        # checkout's temporary HOME trust does not cover later root-run steps.
        # Restrict the exception to this checkout; never trust all repositories.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: ROS build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential git python3-pip python3-venv \
            python3-colcon-common-extensions libglfw3-dev libfmt-dev libeigen3-dev libtinyxml2-dev \
            ros-humble-moveit ros-humble-ros2-control ros-humble-ros2-controllers \
            ros-humble-control-toolbox ros-humble-backward-ros ros-humble-xacro \
            ros-humble-rmw-cyclonedds-cpp ros-humble-ros2-control-cmake
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Build locked runtime and selected model
        run: |
          mkdir -p runtime/validation
          set -o pipefail
          if [[ '${{ matrix.robot }}' == 'workcell' ]]; then
            python3 build_workspace.py --download-debs --workcell '${{ matrix.scene }}' 2>&1 | tee runtime/validation/build.log
          else
            python3 build_workspace.py --download-debs --robots '${{ matrix.robot }}' --scene '${{ matrix.scene }}' 2>&1 | tee runtime/validation/build.log
          fi
      - name: Model regression checks
        if: matrix.scene == 'default' || matrix.robot == 'workcell'
        run: PYTHONPATH=src .venv/bin/python -m unittest discover -s tests/model -t . -v
      - name: Actual ROS / MoveIt headless verification
        run: |
          source ./manipulation_env.sh
          # Repeat UR5e without retries: any failed run fails the job and keeps its report.
          count=1
          if [[ '${{ matrix.robot }}' == 'ur5e' ]]; then count=3; fi
          if [[ '${{ matrix.robot }}' == 'workcell' ]]; then count=2; fi
          for ((run=1; run<=count; run++)); do
            if [[ '${{ matrix.robot }}' == 'workcell' ]]; then
              python3 verify_scene.py --workcell '${{ matrix.scene }}' --domain "$((93 + run))"
            else
              python3 verify_robot.py --robot '${{ matrix.robot }}' --scene '${{ matrix.scene }}' --domain "$((93 + run))"
            fi
          done
      - name: Persistent commands and request-correlated wall timings
        if: matrix.robot == 'workcell'
        run: |
          source ./manipulation_env.sh
          python3 verify_motion_commands.py --domain 138
      - name: Fixed home clearance witness and fresh request traces
        if: matrix.robot == 'workcell'
        run: |
          source ./manipulation_env.sh
          python3 reproduce_motion.py --mode witness
          python3 reproduce_motion.py --mode live --domain 154
      - name: Operator console HTTP to actual ROS motion and cancellation
        if: matrix.robot == 'workcell'
        run: |
          source ./manipulation_env.sh
          python3 verify_operator_console.py --domain 143 --no-render --startup-cycles 2 --startup-hold-seconds 2
      - name: Paired seeded motion benchmark smoke test
        if: matrix.robot == 'workcell'
        run: |
          source ./manipulation_env.sh
          python3 benchmark_motion.py --count 2 --radius 0.15 --compute-budget 8 --require-all-success --domain 139
          python3 benchmark_motion.py --count 1 --radius 0.15 --compute-budget 0.01 --expect-budget-exhaustion --domain 140
      - name: Contact stop fault injection (two fresh launches)
        if: matrix.robot == 'workcell'
        run: |
          source ./manipulation_env.sh
          python3 verify_contact_stop.py --workcell '${{ matrix.scene }}' --domain 111
          python3 verify_contact_stop.py --workcell '${{ matrix.scene }}' --domain 112 --paused-contact
      - name: Matched obstacle and no-obstacle control (no injection)
        if: matrix.robot == 'workcell'
        run: |
          source ./manipulation_env.sh
          python3 verify_contact_demo.py --domain 113
          python3 verify_contact_demo.py --domain 114 --control
          python3 scripts/compare_contact_demo.py \
            --contact-report runtime/validation/visible_contact_fr5_ur5e_headless.json \
            --control-report runtime/validation/control_contact_fr5_ur5e_headless.json \
            --summary-only --output-dir runtime/validation/contact_comparison
      - name: Core process crash shutdown (two fresh launches)
        if: matrix.robot == 'workcell'
        run: |
          source ./manipulation_env.sh
          python3 verify_process_crash.py --target move_group --domain 115
          python3 verify_process_crash.py --target ros2_control_node --domain 116
      - name: Clock stall watchdog (missing and repeated stamps)
        if: matrix.robot == 'workcell'
        run: |
          source ./manipulation_env.sh
          python3 verify_clock_stop.py --mode missing --domain 119
          python3 verify_clock_stop.py --mode repeated --domain 120
      - name: Dual-arm interference rejection and coordinated avoidance
        if: matrix.robot == 'workcell'
        run: |
          source ./manipulation_env.sh
          python3 verify_interference.py --domain 126
          python3 verify_interference.py --domain 127
      - name: Matched single-arm / actual arm contact / coordinated avoidance
        if: matrix.robot == 'workcell'
        run: |
          source ./manipulation_env.sh
          python3 verify_interference_comparison.py \
            --freeze-report runtime/validation/interference_dual_arm_crossing_fr5_ur5e_headless.json \
            --bundle runtime/validation/interference-comparison-bundle.json
          for mode in left right collision avoidance; do
            python3 verify_interference_comparison.py --mode "$mode" --domain 129 \
              --bundle runtime/validation/interference-comparison-bundle.json
          done
          python3 scripts/compare_interference.py --summary-only \
            --output-dir runtime/validation/interference-comparison
      - name: Path quality and departure timing against original detour
        if: matrix.robot == 'workcell'
        run: |
          source ./manipulation_env.sh
          python3 verify_timing.py --prepare \
            --bundle runtime/validation/interference-comparison-bundle.json \
            --plan runtime/validation/timing-plan.json
          for mode in baseline timing; do
            python3 verify_timing.py --mode "$mode" --domain 135 \
              --bundle runtime/validation/interference-comparison-bundle.json \
              --plan runtime/validation/timing-plan.json
          done
          python3 scripts/compare_timing.py --summary-only \
            --plan runtime/validation/timing-plan.json \
            --output-dir runtime/validation/timing-comparison
      - name: Search optimization equivalence on frozen CI trajectories
        if: matrix.robot == 'workcell'
        run: |
          source ./manipulation_env.sh
          python3 scripts/compare_search_optimization.py \
            --bundle runtime/validation/interference-comparison-bundle.json --case crossing --repeats 1 \
            --output runtime/validation/search-optimization-ci.json
      - name: Preserve reports on success or failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ros-${{ matrix.robot }}-${{ matrix.scene }}
          path: |
            runtime/validation/
            runtime/generated/workcells/
            ros_ws/log/
            models/**/source.json
          if-no-files-found: warn
          retention-days: 14
