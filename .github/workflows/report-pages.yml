name: Publish reports
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/report-pages.yml'
      - 'docs/reports/**'
      - 'docs/operator/**'
      - 'src/mujoco_ros2_manipulation/reporting/**'
      - 'scripts/check_published_reports.py'
      - 'pyproject.toml'
      - 'requirements.txt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: report-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install '.[reports]'
      - name: Validate report sources and generated files
        run: |
          manipulation-report validate
          manipulation-report build --check
          python -m unittest tests.unit.test_publication_reports tests.unit.test_published_reports -q
          manipulation-report site --output runtime/report-site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: runtime/report-site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
      - name: Verify published bytes against this commit
        env:
          REPORT_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/check_published_reports.py --url "$REPORT_URL" --manifest docs/reports/site-manifest.json --attempts 12 --delay 5
